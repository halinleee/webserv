server 8080

	client_max_body_size 1000000
	error_page 400 ./www/error/400.html
	connection_timeout 60
	read_timeout 60
	write_timeout 60
	keep_alive_timeout 75
	cgi_timeout 60

	location /
		root ./www
		index index.html

	location /files
		root ./files
		autoindex on

	location /upload
		methods POST
		root ./uploads

	location /storage
		methods POST
		root ./uploads

	location /download
		root ./files
		autoindex on

	location /old_stuff
		return 301 /new_stuff/
		methods GET

	location /new_stuff
		root ./files
		autoindex on

	location /cgi-bin
		alias ./src/cgi
		methods GET POST
		cgi_ext .py /usr/bin/python3

	location /cgi-test
		alias ./www-files/cgi-bin
		methods GET POST
		cgi_ext .cgi /usr/bin/python3
end
