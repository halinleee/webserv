<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>게시판</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="ocean-bg" id="oceanBg"></div>
<header>
    <a href="/">게시판</a>
    <nav><a href="uploads/upload.html">글쓰기</a></nav>
</header>
<main>
    <ul class="post-list" id="post-list"></ul>
    <p class="empty" id="empty-msg" style="display:none;">아직 게시글이 없습니다.</p>
</main>
<script>
fetch('/data/posts.json')
    .then(function (res) { return res.json(); })
    .then(function (posts) {
        var list = document.getElementById('post-list');
        if (!posts || posts.length === 0) {
            document.getElementById('empty-msg').style.display = 'block';
            return;
        }
        posts.forEach(function (post) {
            var li = document.createElement('li');
            li.innerHTML =
                (post.image ? '<img class="thumb" src="' + post.image + '">' : '') +
                '<div><div class="title">' + post.title + '</div>' +
                '<div class="content">' + (post.content || '') + '</div>' +
                '<div class="meta">' + (post.date || '') + '</div></div>' +
                '<button type="button" class="btn delete-btn">아토믹</button>';
            li.addEventListener('click', function () {
                li.classList.toggle('expanded');
            });
            var deleteBtn = li.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!confirm('I am atomic')) {
                    return;
                }
                deleteBtn.disabled = true;
                fetch('/cgi-bin/post_delete.py', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'id=' + encodeURIComponent(post.id)
                })
                    .then(function (res) {
                        if (!res.ok) {
                            throw new Error('delete failed');
                        }
                        li.remove();
                        if (!list.children.length) {
                            document.getElementById('empty-msg').style.display = 'block';
                        }
                    })
                    .catch(function () {
                        deleteBtn.disabled = false;
                        alert('삭제에 실패했습니다.');
                    });
            });
            list.appendChild(li);
        });
    })
    .catch(function () {
        document.getElementById('empty-msg').style.display = 'block';
    });
</script>
<script src="/assets/bubbles.js"></script>
</body>
</html>
