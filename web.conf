server 9090

	client_max_body_size 1000000
	error_page 400 ./www/error/400.html
	keep_alive_timeout 75

	location /
		root ./www
		index index.html

	location /files
		root ./files
		autoindex on

	location /upload
		methods POST
		root ./uploads

	location /old_stuff
		return 301 /files
		methods GET

	location /cgi_bin
		root ./src/cgi/
		methods GET POST
		cgi_ext .py /usr/bin/python3
end



