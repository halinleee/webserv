server 8080

	client_max_body_size 1000000
	error_page 400 /errors/400.html

	connection_timeout 60
	read_timeout 60
	write_timeout 60
	keep_alive_timeout 75
	cgi_timeout 60

	location /
		alias /files/root/
		index index.html

	location /files
		root /files/root
		autoindex on 

	location /upload
		methods POST
		root /uploads

	location /old_stuff
		return 301 /files
		methods GET

	location /cgi_bin
		root /cgi_bin
		methods GET POST
		cgi_ext .py /
end